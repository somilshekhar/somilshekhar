name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=somilshekhar&show_icons=true&theme=react&hide_border=true&bg_color=0d1117&title_color=00d9ff&icon_color=00d9ff&text_color=ffffff&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=somilshekhar&layout=compact&langs_count=8&theme=react&hide_border=true&bg_color=0d1117&title_color=00d9ff&text_color=ffffff
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin Crowd Management
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=somilshekhar&repo=Crowd-Management-System&theme=react&hide_border=true&bg_color=0d1117&title_color=00d9ff&icon_color=00d9ff
          path: profile/pin-crowd.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin Portfolio
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=somilshekhar&repo=New-Portfolio&theme=react&hide_border=true&bg_color=0d1117&title_color=00d9ff&icon_color=00d9ff
          path: profile/pin-portfolio.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
